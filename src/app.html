<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="text-scale" content="scale">
		<meta name="theme-color" content="#ffffff">
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48">
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml">
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png">
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest">
		<script>
			// Set the theme before first paint so dark-mode visitors never see a white flash.
			// Explicit choice (localStorage) wins; otherwise follow the OS. See src/lib/theme.svelte.ts.
			(() => {
				let t;
				try {
					t = localStorage.getItem('theme');
				} catch {}
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				const r = document.documentElement;
				r.dataset.theme = t;
				r.style.colorScheme = t;
				if (t === 'dark') {
					document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0b0f14');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
